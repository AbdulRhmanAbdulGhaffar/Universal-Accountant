version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ua_db
      POSTGRES_USER: ua_user
      POSTGRES_PASSWORD: ua_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  web:
    build:
      context: ..
      dockerfile: compose/web.Dockerfile
    env_file:
      - ../env/.env.example
    command: ["bash", "-lc", "python src/manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"]
    volumes:
      - ../src:/app/src
    depends_on: [db]
    ports: ["8000:8000"]

  worker:
    build:
      context: ..
      dockerfile: compose/celery.Dockerfile
    env_file:
      - ../env/.env.example
    command: ["bash", "-lc", "celery -A config worker -l info"]
    depends_on: [redis, web]

volumes:
  db_data:

  beat:
    build:
      context: ..
      dockerfile: compose/celery.Dockerfile
    env_file:
      - ../env/.env.example
    command: ["bash","-lc","celery -A config beat -l info"]
    depends_on: [redis, web]
