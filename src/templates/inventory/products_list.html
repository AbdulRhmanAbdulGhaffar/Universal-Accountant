{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>المنتجات</h3>
  <a class="btn btn-primary" href="#">+ منتج جديد</a>
</div>
<table class="table table-striped">
  <thead><tr><th>SKU</th><th>الاسم</th><th>السعر</th><th>الحد الأدنى</th></tr></thead>
  <tbody>
    {% for p in products %}
      <tr><td>{{ p.sku }}</td><td>{{ p.name }}</td><td>{{ p.price }}</td><td>{{ p.min_stock }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
