{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>العملاء</h3>
  <a class="btn btn-primary" href="#">+ عميل جديد</a>
</div>
<table class="table table-striped">
  <thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th></tr></thead>
  <tbody>
    {% for c in customers %}
      <tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
